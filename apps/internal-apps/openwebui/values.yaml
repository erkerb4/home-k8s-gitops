openwebui:
  defaultPodOptions:
    automountServiceAccountToken: false
    dnsConfig:
      options:
        - name: ndots
          value: "3"
    securityContext:
      # runAsUser: 1234
      # fsGroup: 1234
      # fsGroupChangePolicy: "Always"
      # runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
  controllers:
    openwebui:
      type: deployment
      annotations:
        reloader.stakater.com/auto: "true"
      containers:
        main:
          image:
            repository: ghcr.io/open-webui/open-webui
            tag: "0.9.4"
            pullPolicy: IfNotPresent
          env:
            TZ: "America/New_York"
            #WEBUI_AUTH: "false"
            WEBUI_URL: "https://chatgpt.xtr.pub"
            CORS_ALLOW_ORIGIN: "https://chatgpt.xtr.pub"
            WEBUI_SESSION_COOKIE_SECURE: "true"
            OPENAI_API_BASE_URLS: "https://lemon.xtr.pub/v1;https://lemonade.xtr.pub/v1"
            ENABLE_WEB_SEARCH: "true"
            WEB_SEARCH_ENGINE: "searxng"
            SEARXNG_QUERY_URL: "http://search.xtr.pub/search?q=<query>"
            ## Performance Options Start
            ENABLE_BASE_MODELS_CACHE: "true"
            MODELS_CACHE_TTL: "300"
            ENABLE_QUERIES_CACHE: "true"
            DATABASE_USER_ACTIVE_STATUS_UPDATE_INTERVAL: "120"
            CHAT_RESPONSE_STREAM_DELTA_CHUNK_SIZE: "10"
            THREAD_POOL_SIZE: "1000"
            AIOHTTP_CLIENT_ASYNC_DNS_RESOLVER: "true"
            ENABLE_CONTEXT_COMPACTION: "false"
            CONTEXT_COMPACTION_MODEL: "thor.Llama-3.2-3B-Instruct-GGUF"
            CONTEXT_COMPACTION_TOKEN_THRESHOLD: "81920"
            CONTEXT_COMPACTION_TOKEN_CAP: "98304"
            CONTEXT_COMPACTION_RETENTION_PERCENTAGE: "40"
            RAG_EMBEDDING_ENGINE: "ollama"
            RAG_EMBEDDING_MODEL: "Qwen3-Embedding-4B-GGUF"
            ## Performance Options End
            ### OIDC START
            ENABLE_LOGIN_FORM: "false"
            ENABLE_OAUTH_SIGNUP: "true"
            OAUTH_AUTO_REDIRECT: "true"
            OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
            OAUTH_PROVIDER_NAME: "BayLabs Login"
            OAUTH_SCOPES: "openid email profile groups"
            ENABLE_OAUTH_ROLE_MANAGEMENT: "true"
            OAUTH_ROLES_CLAIM: "groups"
            OAUTH_ADMIN_ROLES: "openwebui-mgr"
            OAUTH_ALLOWED_ROLES: "openwebui-mgr,openwebui"
            OAUTH_CLIENT_ID:
              valueFrom:
                secretKeyRef:
                  name: openwebui-oidc-credentials
                  key: client_id
            OAUTH_CLIENT_SECRET:
              valueFrom:
                secretKeyRef:
                  name: openwebui-oidc-credentials
                  key: client_secret
            OPENID_PROVIDER_URL:
              valueFrom:
                secretKeyRef:
                  name: openwebui-oidc-credentials
                  key: discovery_url
          ### OIDC End
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          resources:
            limits:
              cpu: "4"
              memory: 4000Mi
            requests:
              cpu: "250m"
              memory: 768Mi

  service:
    openwebui:
      controller: openwebui
      annotations:
        traefik.ingress.kubernetes.io/service.serversscheme: http
      ports:
        http:
          enabled: true
          primary: true
          port: 8080
          protocol: HTTP

  ingress:
    main:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: le-prod
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.pathmatcher: PathPrefix
      hosts:
        - host: chatgpt.xtr.pub
          paths:
            - path: /
              pathType: ImplementationSpecific
              service:
                identifier: openwebui
                port: http
      tls:
      - hosts:
        - chatgpt.xtr.pub
        secretName: tls-secret

  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      storageClass: ec-gold
      accessMode: ReadWriteOnce
      size: "5Gi"
      advancedMounts:
        openwebui:
          main:
            - path: /app/backend/data

  networkpolicies:
    main:
      enabled: false
      controller: openwebui
      policyTypes:
        - Ingress
        - Egress
      rules:
        ingress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    name: traefik
                podSelector:
                  matchLabels:
                     app.kubernetes.io/name: traefik
          - from:
              - podSelector: {}
        egress:
          - to:
              - namespaceSelector: {}
                podSelector:
                  matchLabels:
                    k8s-app: kube-dns
            ports:
              - port: 53
                protocol: UDP
          - to:
              - podSelector: {}
          - to:
              - ipBlock:
                  cidr: 0.0.0.0/0

imageUpdater:
  images:
  - alias: "openwebui"
    imageName: "ghcr.io/open-webui/open-webui:0.x"
    commonUpdateSettings:
      updateStrategy: "semver"
    manifestTargets:
      helm:
        name: "openwebui.controllers.openwebui.containers.main.image.repository"
        tag: "openwebui.controllers.openwebui.containers.main.image.tag"